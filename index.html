<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>美股每日社区情绪简报</title>
<style>
  :root{color-scheme:dark;--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--sub:#8b949e;--gold:#f3c969}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:48px 20px 80px}
  h1{font-size:28px;margin:0 0 8px;color:var(--gold)}
  .sub{color:var(--sub);margin:0 0 28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
  code{background:#21262d;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:#79c0ff}
</style>
</head>
<body>
<div class="wrap">
  <h1>美股每日社区情绪简报</h1>
  <p class="sub">等待首次每日推送 · 数据来自 Reddit / X / Polymarket 公开讨论与预测市场</p>
  <div class="card">
    <p>这是 Cue 每日简报的固定落脚页。</p>
    <p>每个交易日早上 8:30（北京时间）任务跑完后，会把完整简报写入仓库根目录的 <code>index.html</code> 并推送到这里。</p>
    <p>页面地址固定为：<code>https://mhaozhang.github.io/us-daily-brief/</code></p>
    <p style="color:var(--sub);font-size:14px;margin-top:20px">本页所有内容仅为公开信息整理，不构成投资建议。预测市场赔率会随时变动。</p>
  </div>
</div>
</body>
</html>
